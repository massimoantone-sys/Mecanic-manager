<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meca Manager</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MecaManager">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-blue: #007bff;
            --accent-green: #2ec4b6;
            --accent-red: #e63946;
            --text-color: #ffffff;
            --text-secondary: #8d99ae;
            --border-color: #2a3a5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 90px; }
        header { padding: 50px 20px 15px; background: linear-gradient(180deg, rgba(11,19,43,1) 0%, rgba(28,37,65,0.85) 100%); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
        .app-title { display: flex; align-items: center; gap: 12px; }
        .app-icon { width: 42px; height: 42px; background: #0077b6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .title-text h1 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: white; }
        .tag-pro { background: #00b4d8; color: #000; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
        .subtitle { font-size: 0.8rem; color: var(--text-secondary); }
        
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px 20px; }
        .metric-card { background: var(--card-bg); padding: 12px 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .metric-title { font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
        .metric-value { font-size: 1.6rem; font-weight: 800; color: #00b4d8; }
        .btn-add { grid-column: span 2; background: var(--accent-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3); }

        .search-box { padding: 0 20px 15px; }
        .search-input { width: 100%; padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 0.9rem; }
        .search-input::placeholder { color: var(--text-secondary); }

        .items-list { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: white; }
        .status-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; font-weight: 700; text-transform: uppercase; }
        .status-atelier { background: rgba(230, 57, 70, 0.2); color: #ff4d6d; border: 1px solid #e63946; }
        .status-mer { background: rgba(46, 196, 182, 0.2); color: #2ec4b6; border: 1px solid #2ec4b6; }
        .status-hivernage { background: rgba(141, 153, 174, 0.2); color: #8d99ae; border: 1px solid #8d99ae; }
        .card-sub { font-size: 0.85rem; color: #00b4d8; font-weight: 600; }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.8rem; color: var(--text-secondary); background: rgba(11, 19, 43, 0.5); padding: 10px; border-radius: 8px; }
        .details-full { grid-column: span 2; }
        
        .card-actions { display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .btn-sm { padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; border: none; cursor: pointer; flex: 1; text-align: center; text-decoration: none; display: inline-block;}
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-secondary { background: var(--border-color); color: white; }
        .btn-danger { background: rgba(236, 57, 70, 0.2); color: #ff4d6d; border: 1px solid var(--accent-red); flex: 0.4; }

        .stock-row { display: flex; gap: 12px; align-items: center; }
        .stock-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: var(--bg-color); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .stock-qty { font-size: 1.2rem; font-weight: 800; color: var(--accent-green); }
        .stock-qty.low { color: var(--accent-red); }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .btn-qty { width: 32px; height: 32px; border-radius: 8px; background: var(--border-color); color: white; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; }

        /* Vue Fiche Bateau Individuelle */
        .view-detail { padding: 20px; display: none; flex-direction: column; gap: 15px; }
        .back-btn { background: var(--border-color); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; align-self: flex-start; margin-bottom: 5px; }
        .maintenance-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .maintenance-item { background: rgba(11, 19, 43, 0.6); padding: 10px; border-radius: 8px; border-left: 4px solid var(--accent-green); font-size: 0.85rem; margin-top: 5px; }
        .stock-use-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-color); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.85rem; margin-bottom: 6px; }
        .stock-use-input { width: 70px; padding: 6px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; text-align: center; font-size: 0.85rem; }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(11, 19, 43, 0.95); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0 25px; backdrop-filter: blur(10px); z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 0.75rem; text-decoration: none; gap: 4px; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: #00b4d8; font-weight: 700; }
        .nav-icon { font-size: 20px; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 420px; padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { font-size: 1.1rem; margin-bottom: 5px; color: white; }
        .modal-input, .modal-select { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 0.85rem; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="app-title">
            <div class="app-icon">⚓</div>
            <div class="title-text">
                <h1>Meca Manager</h1>
                <div class="subtitle" id="view-subtitle">Gestion de Flotte Bateaux</div>
            </div>
        </div>
    </header>

    <!-- VUE PRINCIPALE -->
    <div id="main-app-container">
        <section class="metrics-grid" id="metrics-container"></section>

        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Rechercher...">
        </div>

        <section class="items-list" id="boats-view"></section>
        <section class="items-list" id="stock-view" style="display: none;"></section>
    </div>

    <!-- VUE FICHE BATEAU INDIVIDUELLE -->
    <div class="view-detail" id="boat-detail-view">
        <button class="back-btn" onclick="backToFlotte()">← Retour à la Flotte</button>
        <div id="boat-detail-content"></div>
        
        <div class="maintenance-box">
            <h3 style="font-size: 1rem; color: #00b4d8;">🛠️ Enregistrer une Maintenance</h3>
            <input type="text" id="m-desc" class="modal-input" placeholder="Description des travaux (ex: Révision, filtres...)">
            <input type="number" id="m-new-hours" class="modal-input" placeholder="Nouvel index compteur heures (ex: 365)">
            <label style="font-size: 0.8rem; color: var(--text-secondary);">Pièces et consommables utilisés :</label>
            <div style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;" id="stock-usage-container"></div>
            <button class="btn-sm btn-primary" style="padding: 12px; margin-top: 5px;" onclick="saveMaintenance()">Valider & Mettre à jour</button>
        </div>

        <div class="card" style="margin-top: 10px;">
            <h3 style="font-size: 1rem; margin-bottom: 10px; color: white;">📋 Historique des Maintenances</h3>
            <div id="maintenance-history-list"></div>
        </div>
    </div>

    <!-- Navigation du bas -->
    <nav class="bottom-nav" id="bottom-navigation">
        <button class="nav-item active" id="nav-flotte" onclick="switchTab('flotte')">
            <span class="nav-icon">⛵</span>
            <span>Flotte</span>
        </button>
        <button class="nav-item" id="nav-stock" onclick="switchTab('stock')">
            <span class="nav-icon">📦</span>
            <span>Stock Pièces</span>
        </button>
    </nav>

    <!-- MODAL BATEAU -->
    <div class="modal" id="boat-modal">
        <div class="modal-content">
            <h2>Nouveau Bateau</h2>
            <input type="text" id="b-name" class="modal-input" placeholder="Nom du bateau *">
            <input type="text" id="b-model" class="modal-input" placeholder="Marque & Modèle *">
            <input type="text" id="b-owner" class="modal-input" placeholder="Nom du propriétaire & Tél">
            <input type="text" id="b-immat" class="modal-input" placeholder="Immatriculation / CIN (N° de coque)">
            <input type="text" id="b-engine-sn" class="modal-input" placeholder="Numéro de série Moteur">
            <select id="b-status" class="modal-select">
                <option value="atelier">En Atelier / Entretien</option>
                <option value="mer">En Mer / Prêt</option>
                <option value="hivernage">En Hivernage</option>
            </select>
            <input type="number" id="b-hours" class="modal-input" placeholder="Heures Moteur Initiales">
            <select id="b-fuel" class="modal-select">
                <option value="Essence">Essence</option>
                <option value="Diesel">Diesel</option>
                <option value="Électrique">Électrique</option>
            </select>
            <input type="text" id="b-notes" class="modal-input" placeholder="Notes / Travaux à prévoir">
            <div class="modal-buttons">
                <button class="btn-sm btn-secondary" onclick="closeModals()">Annuler</button>
                <button class="btn-sm btn-primary" onclick="saveBoat()">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- MODAL STOCK -->
    <div class="modal" id="stock-modal">
        <div class="modal-content">
            <h2>Nouvelle Référence Stock</h2>
            <input type="text" id="s-name" class="modal-input" placeholder="Nom de la pièce ou Huile (ex: Huile 15W40) *">
            <input type="text" id="s-ref" class="modal-input" placeholder="Référence / Numéro de série">
            <select id="s-cat" class="modal-select">
                <option value="Moteur / Filtres">Moteur & Filtres</option>
                <option value="Huiles & Chimie">Huiles & Lubrifiants (Litres)</option>
                <option value="Électricité">Électricité & Batterie</option>
                <option value="Sécurité">Sécurité & Armement</option>
                <option value="Castillage">Accastillage</option>
            </select>
            <input type="number" step="0.1" id="s-qty" class="modal-input" placeholder="Quantité initiale (ou Litres) *">
            <input type="number" step="0.1" id="s-min" class="modal-input" placeholder="Alerte Stock Minimum">
            <input type="text" id="s-loc" class="modal-input" placeholder="Emplacement (ex: Bidon Atelier, Rayon M1)">
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary);">Prendre une photo :</label>
                <input type="file" id="s-img-file" accept="image/*" capture="environment" class="modal-input" style="padding: 6px;">
            </div>
            <div class="modal-buttons">
                <button class="btn-sm btn-secondary" onclick="closeModals()">Annuler</button>
                <button class="btn-sm btn-primary" onclick="saveStock()">Ajouter Stock</button>
            </div>
        </div>
    </div>

    <!-- Scripts Firebase et Logique Application -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpJHdSdSimVx_SIAke",
            authDomain: "mecanic-manager.firebaseapp.com",
            projectId: "mecanic-manager",
            storageBucket: "mecanic-manager.appspot.com",
            messagingSenderId: "305702049718",
            appId: "1:305702049718:web:077474c...",
            measurementId: "G-WNYD05J1GF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let boats = [];
        let stock = [];

        let currentTab = 'flotte';
        let activeBoatId = null;

        // Synchronisation en temps réel avec Firestore
        onSnapshot(collection(db, "boats"), (snapshot) => {
            boats = [];
            snapshot.forEach((docSnap) => {
                boats.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderMetrics();
            if (activeBoatId) {
                renderSingleBoatContent();
            } else {
                renderBoats(document.getElementById('search-input').value);
            }
        });

        onSnapshot(collection(db, "stock"), (snapshot) => {
            stock = [];
            snapshot.forEach((docSnap) => {
                stock.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderMetrics();
            if (currentTab === 'stock') {
                renderStock(document.getElementById('search-input').value);
            }
            if (activeBoatId) {
                renderSingleBoatContent();
            }
        });

        window.renderMetrics = function() {
            const container = document.getElementById('metrics-container');
            if (currentTab === 'flotte') {
                container.innerHTML = `
                    <div class="metric-card"><div class="metric-title">FLOTTE TOTALE ⛵</div><div class="metric-value">${boats.length}</div></div>
                    <div class="metric-card"><div class="metric-title">EN ATELIER 🛠</div><div class="metric-value" style="color:#ff4d6d;">${boats.filter(b => b.status === 'atelier').length}</div></div>
                    <button class="btn-add" onclick="openBoatModal()">+ Ajouter Un Bateau</button>
                `;
            } else {
                container.innerHTML = `
                    <div class="metric-card"><div class="metric-title">RÉFÉRENCES 📦</div><div class="metric-value">${stock.length}</div></div>
                    <div class="metric-card"><div class="metric-title">ALERTE STOCK ⚠️</div><div class="metric-value" style="color:${stock.filter(s => s.qty <= s.min).length > 0 ? '#ff4d6d' : '#2ec4b6'}">${stock.filter(s => s.qty <= s.min).length}</div></div>
                    <button class="btn-add" style="background:#2ec4b6;" onclick="openStockModal()">+ Ajouter Une Pièce / Huile</button>
                `;
            }
        }

        window.renderBoats = function(filter = '') {
            const container = document.getElementById('boats-view');
            container.innerHTML = '';
            const filtered = boats.filter(b => b.name.toLowerCase().includes(filter.toLowerCase()) || b.model.toLowerCase().includes(filter.toLowerCase()));

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-secondary);">Aucun bateau trouvé.</div>`;
                return;
            }

            filtered.forEach(b => {
                const card = document.createElement('div');
                card.className = 'card';
                let statusClass = b.status === 'mer' ? 'status-mer' : (b.status === 'hivernage' ? 'status-hivernage' : 'status-atelier');
                let statusLabel = b.status === 'mer' ? 'En Mer' : (b.status === 'hivernage' ? 'Hivernage' : 'En Atelier');

                card.innerHTML = `
                    <div class="card-header">
                        <div><div class="card-title">${b.name}</div><div class="card-sub">${b.model}</div></div>
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </div>
                    <div class="details-grid">
                        <div>👤 <b>Proprio :</b> ${b.owner || 'N/C'}</div>
                        <div>⏱ <b>Heures Moteur :</b> ${b.hours} h</div>
                        <div>⚓ <b>N° Coque :</b> ${b.immat || 'N/C'}</div>
                        <div>⚙️ <b>N° Série Moteur :</b> ${b.engineSn || 'N/C'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-sm btn-primary" onclick="openBoatDetail('${b.id}')">Fiche & Entretien 🛠️</button>
                        <button class="btn-sm btn-danger" onclick="deleteBoat('${b.id}')">🗑</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.renderStock = function(filter = '') {
            const container = document.getElementById('stock-view');
            container.innerHTML = '';
            const filtered = stock.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()) || (s.ref && s.ref.toLowerCase().includes(filter.toLowerCase())));

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-secondary);">Aucune pièce en stock.</div>`;
                return;
            }

            filtered.forEach(s => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let thumbContent = s.img ? `<img src="${s.img}" class="stock-thumb" alt="pièce">` : `<div class="stock-thumb">📦</div>`;
                let isOil = s.cat === 'Huiles & Chimie';

                card.innerHTML = `
                    <div class="stock-row">
                        ${thumbContent}
                        <div style="flex:1; overflow:hidden;">
                            <div class="card-title" style="font-size:1.05rem;">${s.name}</div>
                            <div class="card-sub">Ref : ${s.ref || 'N/A'}</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary);">Catégorie : ${s.cat}</div>
                        </div>
                        <div class="stock-qty ${s.qty <= s.min ? 'low' : ''}">${s.qty} ${isOil ? 'L' : ''}</div>
                    </div>
                    <div class="details-grid">
                        <div>📍 <b>Lieu :</b> ${s.loc || 'Atelier'}</div>
                        <div>⚠️ <b>Min :</b> ${s.min}</div>
                    </div>
                    <div class="card-actions">
                        <div class="qty-controls" style="flex:1;">
                            <button class="btn-qty" onclick="changeQty('${s.id}', -1)">-</button>
                            <span style="font-weight:700; font-size:0.85rem; color:white;">Quantité</span>
                            <button class="btn-qty" onclick="changeQty('${s.id}', 1)">+</button>
                        </div>
                        <button class="btn-sm btn-danger" onclick="deleteStock('${s.id}')">🗑</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.openBoatDetail = function(id) {
            activeBoatId = id;
            document.getElementById('main-app-container').style.display = 'none';
            document.getElementById('bottom-navigation').style.display = 'none';
            document.getElementById('boat-detail-view').style.display = 'flex';
            renderSingleBoatContent();
        }

        window.backToFlotte = function() {
            activeBoatId = null;
            document.getElementById('boat-detail-view').style.display = 'none';
            document.getElementById('main-app-container').style.display = 'block';
            document.getElementById('bottom-navigation').style.display = 'flex';
            renderBoats();
        }

        window.renderSingleBoatContent = function() {
            const boat = boats.find(b => b.id === activeBoatId);
            if(!boat) return;
            if(!boat.logs) boat.logs = [];

            document.getElementById('view-subtitle').innerText = `Fiche : ${boat.name}`;

            let statusLabel = boat.status === 'mer' ? 'En Mer' : (boat.status === 'hivernage' ? 'Hivernage' : 'En Atelier');
            
            document.getElementById('boat-detail-content').innerHTML = `
                <div class="card" style="margin:0;">
                    <div class="card-header">
                        <div><div class="card-title">${boat.name}</div><div class="card-sub">${boat.model}</div></div>
                        <span class="status-badge status-${boat.status}">${statusLabel}</span>
                    </div>
                    <div class="details-grid">
                        <div>👤 <b>Proprio :</b> ${boat.owner || 'N/C'}</div>
                        <div>⏱ <b>Heures Moteur :</b> ${boat.hours} h</div>
                        <div>⚓ <b>N° Coque :</b> ${boat.immat || 'N/C'}</div>
                        <div>⚙️ <b>N° Série Moteur :</b> ${boat.engineSn || 'N/C'}</div>
                        <div>⛽ <b>Carburant :</b> ${boat.fuel}</div>
                        ${boat.notes ? `<div class="details-full">📝 <b>Notes :</b> ${boat.notes}</div>` : ''}
                    </div>
                </div>
            `;

            const usageContainer = document.getElementById('stock-usage-container');
            usageContainer.innerHTML = stock.length === 0 ? '<span style="font-size:0.8rem; color:var(--text-secondary);">Aucune pièce en stock</span>' : '';
            
            stock.forEach(s => {
                let isOil = s.cat === 'Huiles & Chimie';
                usageContainer.innerHTML += `
                    <div class="stock-use-row">
                        <span style="color:white; flex:1;">${s.name} (Dispo: ${s.qty} ${isOil ? 'L' : ''})</span>
                        <input type="number" step="0.1" min="0" class="stock-use-input" data-stock-id="${s.id}" placeholder="${isOil ? 'Litres' : 'Quantité'}">
                    </div>
                `;
            });

            const histContainer = document.getElementById('maintenance-history-list');
            histContainer.innerHTML = boat.logs.length === 0 ? '<div style="font-size:0.85rem; color:var(--text-secondary);">Aucune maintenance enregistrée.</div>' : '';
            
            boat.logs.slice().reverse().forEach(log => {
                histContainer.innerHTML += `
                    <div class="maintenance-item">
                        <div style="font-weight:700; color:#00b4d8; margin-bottom:2px;">📅 ${log.date} - ⏱ Index compteur : ${log.newHours}h</div>
                        <div>${log.desc}</div>
                        ${log.partsUsed && log.partsUsed.length > 0 ? `<div style="font-size:0.75rem; color:var(--accent-green); margin-top:4px;">📦 Éléments utilisés : ${log.partsUsed.join(', ')}</div>` : ''}
                    </div>
                `;
            });
        }

        window.saveMaintenance = async function() {
            const desc = document.getElementById('m-desc').value;
            const newHoursInput = document.getElementById('m-new-hours').value;
            if(!desc) return alert('Veuillez entrer une description des travaux.');

            const boat = boats.find(b => b.id === activeBoatId);
            let updatedHours = boat.hours;
            
            if(newHoursInput !== "") {
                const parsedHours = parseInt(newHoursInput);
                if(!isNaN(parsedHours)) {
                    updatedHours = parsedHours;
                }
            }

            let partsUsedDesc = [];
            const inputs = document.querySelectorAll('.stock-use-input');
            
            for(const input of inputs) {
                const qtyUsed = parseFloat(input.value);
                if(!isNaN(qtyUsed) && qtyUsed > 0) {
                    const stockId = input.getAttribute('data-stock-id');
                    const stockItem = stock.find(s => s.id === stockId);
                    if(stockItem) {
                        const newQty = Math.max(0, parseFloat((stockItem.qty - qtyUsed).toFixed(1)));
                        await updateDoc(doc(db, "stock", stockItem.id), { qty: newQty });
                        let unitLabel = stockItem.cat === 'Huiles & Chimie' ? 'L' : '';
                        partsUsedDesc.push(`${stockItem.name} (-${qtyUsed} ${unitLabel})`);
                    }
                }
            }

            const newLogs = [...(boat.logs || []), {
                date: new Date().toLocaleDateString('fr-FR'),
                desc: desc,
                newHours: updatedHours,
                partsUsed: partsUsedDesc
            }];

            await updateDoc(doc(db, "boats", boat.id), {
                hours: updatedHours,
                logs: newLogs
            });

            document.getElementById('m-desc').value = '';
            document.getElementById('m-new-hours').value = '';
        }

        window.openBoatModal = function() { document.getElementById('boat-modal').classList.add('active'); }
        window.openStockModal = function() { document.getElementById('stock-modal').classList.add('active'); }
        window.closeModals = function() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        window.saveBoat = async function() {
            const name = document.getElementById('b-name').value;
            const model = document.getElementById('b-model').value;
            if(!name || !model) return alert('Remplir le nom et le modèle.');

            try {
                await addDoc(collection(db, "boats"), {
                    name: name, 
                    model: model,
                    owner: document.getElementById('b-owner').value,
                    immat: document.getElementById('b-immat').value,
                    engineSn: document.getElementById('b-engine-sn').value,
                    status: document.getElementById('b-status').value,
                    hours: parseInt(document.getElementById('b-hours').value) || 0,
                    fuel: document.getElementById('b-fuel').value,
                    notes: document.getElementById('b-notes').value,
                    logs: []
                });
                closeModals();
            } catch (e) {
                console.error("Erreur ajout bateau:", e);
            }
        }

        window.deleteBoat = async function(id) {
            if(confirm("Supprimer ce bateau ?")) {
                try {
                    await deleteDoc(doc(db, "boats", id));
                } catch (e) {
                    console.error("Erreur suppression bateau:", e);
                }
            }
        }

        window.saveStock = function() {
            const name = document.getElementById('s-name').value;
            const qty = parseFloat(document.getElementById('s-qty').value);
            if(!name || isNaN(qty)) return alert('Nom et quantité requis.');

            const fileInput = document.getElementById('s-img-file');
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    finishSaveStock(name, e.target.result, qty);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finishSaveStock(name, "", qty);
            }
        }

        async function finishSaveStock(name, imgSrc, qty) {
            try {
                await addDoc(collection(db, "stock"), {
                    name: name, 
                    ref: document.getElementById('s-ref').value,
                    cat: document.getElementById('s-cat').value, 
                    qty: qty,
                    min: parseFloat(document.getElementById('s-min').value) || 2.0,
                    loc: document.getElementById('s-loc').value,
                    img: imgSrc
                });
                closeModals();
            } catch (e) {
                console.error("Erreur ajout stock:", e);
            }
        }

        window.changeQty = async function(id, delta) {
            const item = stock.find(s => s.id === id);
            if(!item) return;
            const newQty = parseFloat((item.qty + delta).toFixed(1));
            if(newQty < 0) return;
            try {
                await updateDoc(doc(db, "stock", id), { qty: newQty });
            } catch (e) {
                console.error("Erreur mise à jour quantité:", e);
            }
        }

        window.deleteStock = async function(id) {
            if(confirm("Supprimer cette référence ?")) {
                try {
                    await deleteDoc(doc(db, "stock", id));
                } catch (e) {
                    console.error("Erreur suppression stock:", e);
                }
            }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('nav-flotte').classList.toggle('active', tab === 'flotte');
            document.getElementById('nav-stock').classList.toggle('active', tab === 'stock');
            document.getElementById('boats-view').style.display = tab === 'flotte' ? 'flex' : 'none';
            document.getElementById('stock-view').style.display = tab === 'stock' ? 'flex' : 'none';
            document.getElementById('view-subtitle').innerText = tab === 'flotte' ? 'Gestion de Flotte Bateaux' : 'Inventaire Stock & Pièces';
            document.getElementById('search-input').value = '';
            renderMetrics();
            if(tab === 'flotte') renderBoats(); else renderStock();
        }

        document.getElementById('search-input').oninput = (e) => {
            if(currentTab === 'flotte') renderBoats(e.target.value);
            else renderStock(e.target.value);
        };
    </script>
</body>
</html>
